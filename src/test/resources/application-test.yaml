spring:
  flyway:
    enabled: false # tests build the schema from the entities
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/xclone_test}
  jpa:
    hibernate:
      ddl-auto: create-drop

app:
  suggestions:
    popular-cache-ttl: 0s # tests create the data the ranking depends on
  trending:
    cache-ttl: 0s # tests read the ranking straight after creating its data (the cache has its own tests)
  security:
    active-user-cache-ttl: 0s # tests change account status directly in the database
  websocket:
    redis-relay: false # relay behavior has its own tests
  rate-limit:
    enabled: false # integration tests create dozens of accounts from one IP
  jwt:
    secret: test-only-secret-test-only-secret-test-only-secret
  r2:
    public-base-url: https://media.test
