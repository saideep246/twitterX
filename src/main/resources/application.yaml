spring:
  application:
    name: Xclone-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/xclone}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    # Keep this small: on Neon the pooled (-pooler) URL multiplexes connections through PgBouncer.
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  mail:
    # Only used when SPRING_MAIL_HOST is set (see README, Email). Gmail needs just host, port, username and password: port 587 with STARTTLS
    # and a login are the defaults here. The timeouts matter: without them a mail server that stops answering would leave a request waiting for ever.
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: ${MAIL_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${MAIL_TIMEOUT_MS:5000}
      mail.smtp.writetimeout: ${MAIL_TIMEOUT_MS:5000}
  data:
    redis:
      # Upstash/managed Redis: rediss://default:<password>@<host>:6379 (TLS). Connects lazily, so the app still
      # boots without Redis until a feature that uses it is called.
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: ${REDIS_TIMEOUT:2s}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
  kafka:
    # Only used when KAFKA_ENABLED=true (see app.kafka below); without it nothing connects to a broker.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # The events only say "something changed": an old one is worth nothing, so a new consumer group starts at the end instead of replaying.
      auto-offset-reset: latest
    producer:
      properties:
        # A request must never wait long for a broker that is down (events are sent from a background thread, but it should not hang either).
        max.block.ms: 2000
        request.timeout.ms: 2000
        delivery.timeout.ms: 5000
  flyway:
    # Migrations need session features PgBouncer's transaction mode lacks (advisory locks), so on Neon point
    # MIGRATION_DB_URL at the direct (non-pooler) URL. Defaults to the app's own datasource.
    url: ${MIGRATION_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/xclone}}
    user: ${MIGRATION_DB_USER:${DB_USER:postgres}}
    password: ${MIGRATION_DB_PASSWORD:${DB_PASSWORD:postgres}}
    # Empty databases run V1 normally. To adopt a database that already has the full schema from the old
    # ddl-auto=update setup, set FLYWAY_BASELINE_ON_MIGRATE=true once; it is off by default so a partly-created or
    # shared database fails loudly instead of being silently marked as migrated.
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

# Only the health endpoint is exposed, without details. Use /actuator/health/liveness for "is the process up" and
# /actuator/health/readiness for "can it serve traffic" (database only). Redis and mail are deliberately not part of health:
# the app degrades gracefully without them (it falls back to local delivery / logging the email), so an outage of either
# must not take instances out of rotation or make the app report DOWN.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    redis:
      enabled: false
    mail:
      enabled: false

server:
  port: ${PORT:8080}
  # Set FORWARD_HEADERS_STRATEGY=framework behind a trusted reverse proxy/load balancer so rate limits see the real
  # client IP (X-Forwarded-For). Leave as none otherwise: the header is client-controlled and spoofable.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}

app:
  suggestions:
    # How long the most-followed accounts (the fallback for users who follow few people) are reused before recomputing.
    popular-cache-ttl: ${SUGGESTIONS_POPULAR_CACHE_TTL:10m}
  security:
    # How long an account is remembered as ACTIVE before the database is asked again. Deactivating evicts it on the
    # instance that handled the request; other instances notice within this time. 0 = check on every request.
    active-user-cache-ttl: ${ACTIVE_USER_CACHE_TTL:10s}
  websocket:
    # Fan WebSocket pushes out through Redis so they reach users connected to any instance. Falls back to local
    # delivery when Redis is down. Set false to skip Redis entirely (single instance).
    redis-relay: ${WS_REDIS_RELAY:true}
  kafka:
    # Post and account events go to Kafka after each change commits, and a consumer refreshes the Redis trending cache within seconds instead of
    # waiting for its TTL. Off by default: the app (and trending, with its TTL) works without a broker.
    enabled: ${KAFKA_ENABLED:false}
    topic: ${KAFKA_POST_EVENTS_TOPIC:post-events}
    partitions: ${KAFKA_POST_EVENTS_PARTITIONS:3}
    # At most one refresh per this long per instance, however many events arrive.
    refresh-interval: ${TRENDING_REFRESH_INTERVAL:5s}
  trending:
    # Different accounts that must use a tag in the recent window before it can trend (one account alone never can). Raise it on a busy site.
    min-authors: ${TRENDING_MIN_AUTHORS:2}
    # How long the trending list is reused from Redis (shared by all instances) before it is recomputed; 0 turns the cache off. Works without Redis too.
    cache-ttl: ${TRENDING_CACHE_TTL:30s}
    # An account counts for at most this many posts per window-length (the recent window, and each equal slice of the week before it).
    max-posts-per-author: ${TRENDING_MAX_POSTS_PER_AUTHOR:3}
    # Prior pseudo-count: a tag is treated as if it normally had this many posts/authors per window. Higher demands more evidence; lower lets small tags rank.
    smoothing: ${TRENDING_SMOOTHING:3.0}
    # Accounts younger than this many days count for less, growing linearly to full weight (0 switches the discount off), and a brand-new one counts for new-account-weight.
    mature-account-days: ${TRENDING_MATURE_ACCOUNT_DAYS:3}
    new-account-weight: ${TRENDING_NEW_ACCOUNT_WEIGHT:0.25}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173, http://localhost:8080}
  jwt:
    # Required, at least 32 bytes (256 bits). No default, so a misconfigured deploy fails at startup.
    secret: ${JWT_SECRET}
    access-ttl: ${JWT_ACCESS_TTL:1d}
    refresh-ttl: ${JWT_REFRESH_TTL:30d}
  r2:
    account-id: ${R2_ACCOUNT_ID:}
    access-key: ${R2_ACCESS_KEY:}
    secret-key: ${R2_SECRET_KEY:}
    bucket: ${R2_BUCKET:xclone-media}
    public-base-url: ${R2_PUBLIC_BASE_URL:}
    presign-ttl: ${R2_PRESIGN_TTL:10m}
    max-image-bytes: ${R2_MAX_IMAGE_BYTES:5242880}
    # Leave empty for Cloudflare R2. Only for another S3-compatible server (a local MinIO, for instance).
    endpoint-override: ${R2_ENDPOINT:}
  mail:
    from: ${MAIL_FROM:no-reply@xclone.local}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    verify-ttl: ${MAIL_VERIFY_TTL:24h}
    reset-ttl: ${MAIL_RESET_TTL:1h}
